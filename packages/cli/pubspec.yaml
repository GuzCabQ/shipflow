name: cli
description: "Comandos, instalacion, CredentialStore. Composition root."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.6.0

resolution: workspace

# **Lo que se declara acá es lo que se USA, no lo que está permitido.**
#
# `arquitectura.json` permite que `cli` vea también `vcs`, `rules` y `agents`:
# eso es la arquitectura, y no cambia. Pero ningún archivo de `lib/`, `bin/` ni
# `test/` los importa —`rules` y `agents` son stubs de dos líneas, y `vcs` no
# tiene consumidor porque `ship` no existe—, así que declararlos acá afirmaba un
# uso que no hay. La flecha vuelve en el mismo commit que la use.
dependencies:
  core:
    path: ../core
  orchestration:
    path: ../orchestration
  plugin_dart:
    path: ../plugin_dart

# Las suites de contrato viven acá, así que la dependencia es real y se declara.
# `core` no puede hacer lo mismo —`nucleo-sin-externas` le prohíbe TODA
# dependencia directa, incluidas las de desarrollo— y por eso sus pruebas usan
# la del workspace. Acá no hace falta esa excepción.
dev_dependencies:
  test: ^1.25.0
  # **De desarrollo, no de producción.** Sus siete imports viven en `test/`, y
  # el paquete se describe a sí mismo como implementaciones falsas «para
  # pruebas». Estaba declarado como dependencia de producción, que decía otra
  # cosa; `plugin_dart` ya usaba el patrón correcto.
  plugin_fake:
    path: ../plugin_fake
