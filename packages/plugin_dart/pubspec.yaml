name: plugin_dart
description: "El reconocimiento de proyectos Dart y Flutter."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  # El detector sintáctico de assess, fijado: parseString y su AST públicos,
  # sin resolver el SDK ni el package_config del proyecto observado.
  analyzer: 14.1.0
  core:
    path: ../core
  crypto: ^3.0.7
  pub_semver: ^2.2.1
  yaml: ^3.1.4

dev_dependencies:
  test: ^1.25.0
