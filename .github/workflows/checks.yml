# Los checks de la fase 0.
#
# Van en CI y no en un gancho local por lo que B3 demostró: la capa de ganchos
# no resiste al operador, y el operador somos nosotros con presión de entrega.
# El fallo del intento anterior fue exactamente eso — un `pre-push` y un
# `--no-verify` que lo salteaba.

name: checks

on:
  push:
  pull_request:

# Least-agency aplicado al CI: el workflow solo lee el repo.
permissions:
  contents: read

jobs:
  capas:
    name: reglas de arquitectura · Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # La versión con la que se verificó. Es la que hace reproducible el
          # resultado. El principio es de docs/09 §3 —«si el arnés cambia entre
          # corridas, las comparaciones no significan nada»— aplicado hacia
          # adentro: docs/08 §4 dice lo mismo del CLI agéntico, no del SDK Dart.
          - sdk: "3.12.0"
            canario: false
          # Y el canal estable como CANARIO: avisa cuando un SDK nuevo rompe
          # algo, sin bloquear el merge. Reporta, no detiene — ADR-013.
          - sdk: stable
            canario: true

    continue-on-error: ${{ matrix.canario }}

    steps:
      # Acciones fijadas por SHA, no por tag: un tag es mutable y esto es
      # código de terceros corriendo con acceso al repo. Es ASI04.
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ matrix.sdk }}

      # `capas.py` lee el workflow con un parser de YAML para verificar que
      # siga ejecutando cada paso obligatorio. No se parsea a mano: un parser
      # casero devuelve cero pasos ante una sintaxis que no reconoce, y cero
      # pasos se lee igual que «están todos». Si este paso desaparece, el
      # import falla y el check se pone rojo — falla del lado seguro.
      # Fijado por versión, como el SDK y las acciones: es código de terceros
      # que corre con acceso al repo, y de él depende el meta-check que decide
      # si CI sigue ejecutando sus propios pasos.
      - name: parser de yaml, para que capas.py pueda leer este workflow
        run: python3 -m pip install --quiet "pyyaml==6.0.3"

      # Deja registrado contra qué se corrió. Sin esto el verde no es comparable.
      - name: versiones
        run: dart --version && python3 --version

      # Precondición de capas.py: el grafo se le pide a pub, no se parsea a mano.
      - name: resolver dependencias
        run: dart pub get

      - name: capas
        run: python3 tool/checks/capas.py

      # Las reglas que necesitan el árbol sintáctico de core. Su paquete está
      # fuera del `workspace:` a propósito, así que resuelve aparte.
      - name: resolver el verificador de árbol sintáctico
        run: dart pub get
        working-directory: tool/analisis

      - name: serialización, opacidad y puertos sin implementación
        run: dart run bin/check.dart
        working-directory: tool/analisis

      # El grafo interno: regenerado contra commiteado. Un mapa desactualizado
      # es peor que no tener mapa — las reglas derivadas de él pasan a ser
      # mentira con aspecto de evidencia.
      - name: grafo · derivado == commiteado
        run: dart run bin/grafo.dart
        working-directory: tool/analisis

      # Y la prueba de que esos checks saben fallar. Corre siempre, no una vez
      # a mano: un guardia que existe y nunca se disparó es indistinguible de
      # uno roto — es F40, y la clase 1 entera del catálogo.
      - name: los checks saben fallar
        run: python3 tool/checks/probar_reglas.py

      # La recuperación ante interrupción es un control como cualquier otro, y
      # los 85 sabotajes corren TODOS por el camino feliz donde el proceso
      # termina: pueden seguir verdes mientras esto se rompe.
      - name: la recuperación sabe hacer su trabajo
        run: python3 tool/checks/probar_recuperacion.py

      - name: pruebas de core
        run: dart test packages/core

      # La cascada: el registro de pasos, la cuenta de registrados contra
      # ejecutados (ADR-011 corolario 2) y la precedencia de estados.
      - name: pruebas de la orquestación
        run: dart test packages/orchestration

      # `vcs` contra `git` de verdad: la rama, los commits y que un commit se
      # quede EXACTAMENTE con los archivos de su rebanada.
      - name: pruebas de vcs
        run: dart test packages/vcs

      # Las suites de CONTRATO, que corren cada puerto contra su implementación
      # real y su fake. Sin ellas, todo lo que se pruebe con el fake queda
      # verde por construcción (docs/08 §2).
      - name: suites de contrato
        run: dart test packages/cli

      # Pruebas unitarias de la implementación real: lo que solo ella puede
      # ejercer y que por eso no pertenece a la suite de contrato.
      - name: pruebas del plugin de stack
        run: dart test packages/plugin_dart

      - name: analyze
        run: dart analyze --fatal-infos

      - name: format
        run: dart format --set-exit-if-changed packages tool

  # EL FIXTURE, EN SU PROPIO JOB. NO ES PROLIJIDAD.
  #
  # `flutter-action` agrega al PATH el Dart que Flutter trae adentro
  # (`flutter/bin/`), así que TODO paso `dart` posterior deja de usar el SDK de
  # la matriz y pasa a usar el de Flutter. Las dos patas terminaban corriendo
  # el mismo Dart, y la matriz —que existe para que el resultado sea
  # reproducible contra una versión declarada— quedaba anulada en silencio.
  #
  # Y con `channel: stable` una versión nueva de Flutter podía romper el
  # fixture y bloquear el merge sin que nadie hubiera cambiado nada. Un canal
  # flotante no puede ser una compuerta obligatoria: acá va FIJADO.
  fixture:
    name: el fixture se verifica a sí mismo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.0

      - name: versiones
        run: flutter --version && dart --version

      # Un fixture commiteado es una fotografía: sus archivos están ahí porque
      # alguien los copió, no porque el proyecto siga funcionando. Es F36.
      - name: fixture · el dominio compila y sus pruebas pasan
        run: dart pub get && dart analyze && dart test
        working-directory: fixtures/app-minima/dominio

      - name: fixture · la app compila y sus pruebas pasan
        run: flutter pub get && flutter analyze && flutter test
        working-directory: fixtures/app-minima/app

# HUECO DECLARADO: el piso `^3.6.0` que declara el pubspec no se verifica acá.
# La matriz cubre la versión con la que se desarrolló y el canal estable, no el
# mínimo soportado. Se agrega cuando exista un caso real que lo justifique
# —alguien con 3.6— y no por anticipación.
