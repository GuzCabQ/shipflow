# Los checks de la fase 0.
#
# Van en CI y no en un gancho local por lo que B3 demostró: la capa de ganchos
# no resiste al operador, y el operador somos nosotros con presión de entrega.
# El fallo del intento anterior fue exactamente eso — un `pre-push` y un
# `--no-verify` que lo salteaba.

name: checks

on:
  push:
  pull_request:

# Least-agency aplicado al CI: el workflow solo lee el repo.
permissions:
  contents: read

jobs:
  capas:
    name: reglas de capa · Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          # La versión con la que se verificó. Es la que hace reproducible el
          # resultado. El principio es de docs/09 §3 —«si el arnés cambia entre
          # corridas, las comparaciones no significan nada»— aplicado hacia
          # adentro: docs/08 §4 dice lo mismo del CLI agéntico, no del SDK Dart.
          - sdk: "3.12.0"
            canario: false
          # Y el canal estable como CANARIO: avisa cuando un SDK nuevo rompe
          # algo, sin bloquear el merge. Reporta, no detiene — ADR-013.
          - sdk: stable
            canario: true

    continue-on-error: ${{ matrix.canario }}

    steps:
      # Acciones fijadas por SHA, no por tag: un tag es mutable y esto es
      # código de terceros corriendo con acceso al repo. Es ASI04.
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ matrix.sdk }}

      # Deja registrado contra qué se corrió. Sin esto el verde no es comparable.
      - name: versiones
        run: dart --version && python3 --version

      # Precondición de capas.py: el grafo se le pide a pub, no se parsea a mano.
      - name: resolver dependencias
        run: dart pub get

      - name: capas
        run: python3 tool/checks/capas.py

      # Y la prueba de que esos checks saben fallar. Corre siempre, no una vez
      # a mano: un guardia que existe y nunca se disparó es indistinguible de
      # uno roto — es F40, y la clase 1 entera del catálogo.
      - name: los checks saben fallar
        run: python3 tool/checks/probar_capas.py

      - name: analyze
        run: dart analyze --fatal-infos

      - name: format
        run: dart format --set-exit-if-changed .

# HUECO DECLARADO: el piso `^3.6.0` que declara el pubspec no se verifica acá.
# La matriz cubre la versión con la que se desarrolló y el canal estable, no el
# mínimo soportado. Se agrega cuando exista un caso real que lo justifique
# —alguien con 3.6— y no por anticipación.
