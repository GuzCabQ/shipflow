# EXPERIMENTO REV-CI-RENDIMIENTO-002 (rama que no se integra): el mismo nombre de
# workflow y la concurrencia bajo prueba, con un solo job que espera, para ver
# qué pasa con tres pushes seguidos fuera de un PR.
name: checks

on:
  push:
    branches: [ci/exp-concurrencia-push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  espera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sleep 150
