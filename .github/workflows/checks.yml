# Los checks de la fase 0.
#
# Van en CI y no en un gancho local por lo que B3 demostró: la capa de ganchos
# no resiste al operador, y el operador somos nosotros con presión de entrega.
# El fallo del intento anterior fue exactamente eso — un `pre-push` y un
# `--no-verify` que lo salteaba.
#
# ORGANIZACIÓN. Todo lo bloqueante corre en jobs paralelos con el SDK fijado, y
# un job final —la COMPUERTA— lleva el nombre que exigen las ramas protegidas y
# solo se pone verde si todos terminaron en verde. El canario `stable` corre en
# jobs propios, a la vista, y nada bloqueante lo espera. `capas.py` fija esta
# forma con `organizacion_ci.py`: jobs, compuerta, grupos, canario, disparadores
# y concurrencia.

name: checks

# Un PR se valida una vez por actualización; un push solo en las ramas de
# integración, que es donde no hay PR que lo cubra. `workflow_dispatch` es la
# vía manual, y GitHub solo la ofrece para workflows presentes en la rama por
# defecto. Una rama de trabajo sin PR no corre sola: un PR borrador alcanza.
on:
  push:
    branches: [develop, production]
  pull_request:
  workflow_dispatch:

# En un PR, la corrida nueva reemplaza a la vieja: verificar un commit que ya
# no es la cabeza no sirve para nada. Fuera de un PR, cada corrida tiene su
# propio grupo —su `run_id`—, así que ninguna queda pendiente detrás de otra:
# con la cola por defecto, una corrida nueva cancela a la PENDIENTE del mismo
# grupo aunque `cancel-in-progress` sea falso, y un commit de integración no se
# reemplaza por el siguiente.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-agency aplicado al CI: el workflow solo lee el repo.
permissions:
  contents: read

jobs:
  # LO ESTÁTICO: las reglas que se leen del texto y del árbol sintáctico, y
  # la prueba de que la recuperación y los agregadores saben fallar.
  estatico:
    name: análisis estático · Dart 3.12.0
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Acciones fijadas por SHA, no por tag: un tag es mutable y esto es
      # código de terceros corriendo con acceso al repo. Es ASI04.
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # La versión con la que se verificó. Es la que hace reproducible el
      # resultado: «si el arnés cambia entre corridas, las comparaciones no
      # significan nada» (docs/09 §3).
      - name: dart · SDK bloqueante
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.12.0"

      # `capas.py` lee el workflow con un parser de YAML para verificar que
      # siga ejecutando cada paso obligatorio. No se parsea a mano: un parser
      # casero devuelve cero pasos ante una sintaxis que no reconoce, y cero
      # pasos se lee igual que «están todos». Fijado por versión: de él
      # depende el meta-check que decide si CI sigue ejecutando sus pasos.
      - name: parser de yaml, para que capas.py pueda leer este workflow
        run: python3 -m pip install --quiet "pyyaml==6.0.3"

      # Deja registrado contra qué se corrió. Sin esto el verde no es comparable.
      - name: versiones
        run: dart --version && python3 --version

      # Precondición de capas.py: el grafo se le pide a pub, no se parsea a mano.
      - name: resolver dependencias
        run: dart pub get

      - name: capas
        run: python3 tool/checks/capas.py

      # Las reglas que necesitan el árbol sintáctico de core. Su paquete está
      # fuera del `workspace:` a propósito, así que resuelve aparte.
      - name: resolver el verificador de árbol sintáctico
        run: dart pub get
        working-directory: tool/analisis

      - name: serialización, opacidad y puertos sin implementación
        run: dart run bin/check.dart
        working-directory: tool/analisis

      # El grafo interno: regenerado contra commiteado. Un mapa desactualizado
      # es peor que no tener mapa.
      - name: grafo · derivado == commiteado
        run: dart run bin/grafo.dart
        working-directory: tool/analisis

      # Los sabotajes corren todos por el camino feliz donde el proceso
      # termina: pueden seguir verdes mientras la recuperación se rompe.
      - name: la recuperación sabe hacer su trabajo
        run: python3 tool/checks/probar_recuperacion.py

      # El conjunto de los sabotajes y la compuerta deciden el merge, así que
      # también tienen que poder ponerse rojos: cada borde que rechazan está
      # probado con entradas construidas.
      - name: los agregadores saben fallar
        run: python3 tool/checks/probar_agregadores.py

      - name: analyze
        run: dart analyze --fatal-infos


  # LAS PRUEBAS · UN PASO POR MIEMBRO DEL `workspace:`.
  #
  # **Cada paso es CONDICIONAL, y la condición es exactamente una.**
  # `dart test packages/X` sobre un paquete sin `test/**/*_test.dart` sale con
  # 79 —«No tests ran»— y el job queda rojo por no haber nada que correr.
  # `hashFiles` devuelve cadena vacía cuando no encuentra archivos, así que
  # `!= ''` es exactamente «existe al menos una prueba».
  #
  # `capas.py` deriva esta lista del `workspace:` de la raíz y compara la
  # condición CARÁCTER POR CARÁCTER. Un pin, no un permiso.
  pruebas:
    name: pruebas del producto · Dart 3.12.0
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: dart · SDK bloqueante
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.12.0"

      - name: resolver dependencias
        run: dart pub get

      # Invariantes del dominio.
      - name: pruebas de core
        if: ${{ hashFiles('packages/core/test/**/*_test.dart') != '' }}
        run: dart test packages/core

      # La cascada: el registro de pasos, la cuenta de registrados contra
      # ejecutados (ADR-011 corolario 2) y la precedencia de estados.
      - name: pruebas de orchestration
        if: ${{ hashFiles('packages/orchestration/test/**/*_test.dart') != '' }}
        run: dart test packages/orchestration

      # `vcs` contra `git` de verdad: la rama, los commits y que un commit se
      # quede EXACTAMENTE con los archivos de su rebanada.
      - name: pruebas de vcs
        if: ${{ hashFiles('packages/vcs/test/**/*_test.dart') != '' }}
        run: dart test packages/vcs

      # La selección y la validación estructural de la base de decisiones.
      - name: pruebas de rules
        if: ${{ hashFiles('packages/rules/test/**/*_test.dart') != '' }}
        run: dart test packages/rules

      # Sin API todavía. El paso existe para que una prueba futura corra.
      - name: pruebas de agents
        if: ${{ hashFiles('packages/agents/test/**/*_test.dart') != '' }}
        run: dart test packages/agents

      # Unitarias de la implementación real.
      - name: pruebas de plugin_dart
        if: ${{ hashFiles('packages/plugin_dart/test/**/*_test.dart') != '' }}
        run: dart test packages/plugin_dart

      # Sin API todavía. El paso existe para que una prueba futura corra.
      - name: pruebas de plugin_fake
        if: ${{ hashFiles('packages/plugin_fake/test/**/*_test.dart') != '' }}
        run: dart test packages/plugin_fake

      # El adapter de la forja contra un servidor local.
      - name: pruebas de forge
        if: ${{ hashFiles('packages/forge/test/**/*_test.dart') != '' }}
        run: dart test packages/forge

      # Las suites de CONTRATO, que corren cada puerto contra su implementación
      # real y su fake (docs/08 §2).
      - name: pruebas de cli
        if: ${{ hashFiles('packages/cli/test/**/*_test.dart') != '' }}
        run: dart test packages/cli


  # LA PRUEBA DE QUE LOS CHECKS SABEN FALLAR, REPARTIDA.
  #
  # Un guardia que existe y nunca se disparó es indistinguible de uno roto
  # —F40, la clase 1 del catálogo—. Corrían todos en secuencia y ocupaban casi
  # todo el job; repartidos, cada grupo corre su porción en su runner y en su
  # copia privada, y ningún par de grupos sabotea el mismo árbol. Cada grupo
  # publica su manifiesto: sin él, el job falla.
  sabotajes:
    name: sabotajes · grupo ${{ matrix.grupo }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        grupo: [1, 2, 3, 4]

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: dart · SDK bloqueante
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.12.0"

      - name: parser de yaml, para que capas.py pueda leer este workflow
        run: python3 -m pip install --quiet "pyyaml==6.0.3"

      - name: resolver dependencias
        run: dart pub get

      - name: resolver el verificador de árbol sintáctico
        run: dart pub get
        working-directory: tool/analisis

      - name: los checks saben fallar
        run: python3 tool/checks/probar_reglas.py --grupo ${{ matrix.grupo }}/4 --resultado "$RUNNER_TEMP/sabotajes.json"

      # El nombre lleva el intento: un reintento del grupo publica otro
      # artefacto, y el conjunto exige el del intento en que el grupo corrió.
      - name: el manifiesto de este grupo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sabotajes-g${{ matrix.grupo }}-i${{ github.run_attempt }}
          path: ${{ runner.temp }}/sabotajes.json
          if-no-files-found: error


  # LOS GRUPOS, JUNTADOS. Reconstruye el inventario y la asignación sobre su
  # propio checkout y exige un manifiesto válido por grupo, del intento en que
  # ese grupo corrió por última vez. `if: always()` para que un grupo rojo no lo
  # deje omitido: tiene que decir que falta.
  sabotajes-conjunto:
    name: sabotajes · conjunto
    needs: [sabotajes]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Leer en qué intento corrió cada grupo pide la API de Actions.
    permissions:
      contents: read
      actions: read

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: dart · SDK bloqueante
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.12.0"

      - name: parser de yaml, para que capas.py pueda leer este workflow
        run: python3 -m pip install --quiet "pyyaml==6.0.3"

      - name: los manifiestos de los grupos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sabotajes-g*-i*
          path: ${{ runner.temp }}/manifiestos

      - name: los intentos de cada grupo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/jobs.json"

      - name: el conjunto de los sabotajes
        run: python3 tool/checks/probar_reglas.py --conjunto "$RUNNER_TEMP/manifiestos" --grupos 4 --jobs "$RUNNER_TEMP/jobs.json"


  # EL FORMATO, EN SU PROPIO JOB.
  #
  # El estilo del formateador **cambia entre versiones menores de Dart**, así
  # que lo decide **un solo SDK, el bloqueante**: con el árbol formateado por
  # 3.12, `stable` reformateaba archivos y el canario quedaba rojo por
  # construcción. `--language-version` no sirve: fija también la GRAMÁTICA.
  #
  # ACOPLE DECLARADO: este `sdk` es el mismo que el de los demás jobs
  # bloqueantes. No hace falta `dart pub get`: `dart format` lee la versión de
  # lenguaje del pubspec más cercano.
  formato:
    name: el formato, con el SDK que decide el estilo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.12.0"

      # `--output=none` porque una COMPUERTA verifica y no muta. El comando es
      # UNO, en CI y en local.
      - name: format
        run: dart format --output=none --set-exit-if-changed packages tool


  # EL EJECUTABLE, EN CADA PLATAFORMA QUE SE DECLARA SOPORTADA.
  #
  # Un artefacto compilado para otra plataforma no demuestra que funcione:
  # cada pata compila en su propio runner y ejecuta lo que compiló. El último
  # paso lo vuelve a invocar por el nombre de release de ESTA pata.
  #
  # `capas.py` fija esta matriz, sus runners, el SDK y estos pasos.
  nativo:
    name: ejecutable nativo · ${{ matrix.plataforma }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            plataforma: linux-x64
          - runner: macos-15
            plataforma: macos-arm64

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: dart, el SDK bloqueante
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.12.0"

      - name: plataforma del runner
        run: dart --version && uname -sm

      - name: dependencias exactas del lockfile
        run: dart pub get --enforce-lockfile

      - name: pruebas del CLI en la plataforma nativa
        run: dart test packages/cli/test

      - name: build oficial nativa
        run: dart run packages/cli/tool/build_release.dart --version 0.0.0-ci --output "$RUNNER_TEMP/shipflow-release"

      - name: el artefacto de esta plataforma responde
        run: test "$("$RUNNER_TEMP/shipflow-release/shipflow-0.0.0-ci-${{ matrix.plataforma }}" --version)" = "shipflow 0.0.0-ci"


  # LA COMPUERTA. Lleva el nombre que exigen `develop` y `production`, y es
  # el único contexto requerido: por eso depende de TODO lo bloqueante y nada
  # del canario. `if: always()` la hace correr aunque un bloqueante falle —si
  # no, quedaría omitida y una omitida no reporta rojo—, y entonces decide
  # `compuerta.py`: solo `success` en cada uno deja pasar.
  compuerta:
    name: reglas de arquitectura · Dart 3.12.0
    needs: [estatico, pruebas, sabotajes, sabotajes-conjunto, formato, nativo]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: la compuerta requerida
        env:
          NECESITA: ${{ toJSON(needs) }}
        run: python3 tool/checks/compuerta.py


  # EL CANARIO: el canal estable, para enterarse cuando un SDK nuevo rompe
  # algo, sin bloquear el merge — reporta, no detiene (ADR-013). Corre lo mismo
  # que el camino bloqueante, salvo el formato, que lo decide un solo SDK.
  # Ningún job bloqueante depende de él: un canario lento no retiene la
  # compuerta. Sus sabotajes van en los mismos grupos que los bloqueantes:
  # en secuencia, con `stable`, no entraban en el límite del job.
  canario-estatico-pruebas:
    name: canario · estático y pruebas · Dart stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: dart stable · canario de estático y pruebas
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: canario · parser de yaml
        run: python3 -m pip install --quiet "pyyaml==6.0.3"

      - name: canario · versiones
        run: dart --version && python3 --version

      - name: canario · resolver dependencias
        run: dart pub get

      - name: canario · capas
        run: python3 tool/checks/capas.py

      - name: canario · resolver el verificador de árbol sintáctico
        run: dart pub get
        working-directory: tool/analisis

      - name: canario · serialización, opacidad y puertos sin implementación
        run: dart run bin/check.dart
        working-directory: tool/analisis

      - name: canario · grafo · derivado == commiteado
        run: dart run bin/grafo.dart
        working-directory: tool/analisis

      - name: canario · la recuperación sabe hacer su trabajo
        run: python3 tool/checks/probar_recuperacion.py

      - name: canario · los agregadores saben fallar
        run: python3 tool/checks/probar_agregadores.py

      - name: canario · analyze
        run: dart analyze --fatal-infos

      - name: canario · pruebas de core
        if: ${{ hashFiles('packages/core/test/**/*_test.dart') != '' }}
        run: dart test packages/core

      - name: canario · pruebas de orchestration
        if: ${{ hashFiles('packages/orchestration/test/**/*_test.dart') != '' }}
        run: dart test packages/orchestration

      - name: canario · pruebas de vcs
        if: ${{ hashFiles('packages/vcs/test/**/*_test.dart') != '' }}
        run: dart test packages/vcs

      - name: canario · pruebas de rules
        if: ${{ hashFiles('packages/rules/test/**/*_test.dart') != '' }}
        run: dart test packages/rules

      - name: canario · pruebas de agents
        if: ${{ hashFiles('packages/agents/test/**/*_test.dart') != '' }}
        run: dart test packages/agents

      - name: canario · pruebas de plugin_dart
        if: ${{ hashFiles('packages/plugin_dart/test/**/*_test.dart') != '' }}
        run: dart test packages/plugin_dart

      - name: canario · pruebas de plugin_fake
        if: ${{ hashFiles('packages/plugin_fake/test/**/*_test.dart') != '' }}
        run: dart test packages/plugin_fake

      - name: canario · pruebas de forge
        if: ${{ hashFiles('packages/forge/test/**/*_test.dart') != '' }}
        run: dart test packages/forge

      - name: canario · pruebas de cli
        if: ${{ hashFiles('packages/cli/test/**/*_test.dart') != '' }}
        run: dart test packages/cli


  canario-sabotajes:
    name: canario · sabotajes · grupo ${{ matrix.grupo }}/4 · Dart stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        grupo: [1, 2, 3, 4]

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: dart stable · canario de sabotajes
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: canario · parser de yaml para los sabotajes
        run: python3 -m pip install --quiet "pyyaml==6.0.3"

      - name: canario · resolver dependencias para los sabotajes
        run: dart pub get

      - name: canario · resolver el verificador para los sabotajes
        run: dart pub get
        working-directory: tool/analisis

      - name: canario · los checks saben fallar, por grupo
        run: python3 tool/checks/probar_reglas.py --grupo ${{ matrix.grupo }}/4 --resultado "$RUNNER_TEMP/sabotajes-canario.json"
