# EXPERIMENTO REV-CI-RENDIMIENTO-002 (rama que no se integra): el mismo nombre de
# workflow y la concurrencia bajo prueba, con un solo job que espera, para ver
# qué pasa con tres pushes seguidos fuera de un PR.
name: checks

on:
  push:
    branches: [ci/exp-concurrencia-rama]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  espera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sleep 150
