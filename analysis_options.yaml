# Análisis estricto desde el commit 0.
#
# Es el único momento en que activarlo cuesta cero: sobre código existente
# produce miles de diagnósticos y termina desactivado. Es la misma "regla del
# ratchet" que el arnés le propone a sus usuarios, aplicada a nosotros.

include: package:lints/recommended.yaml

analyzer:
  # EL FIXTURE NO SE ANALIZA DESDE ACÁ.
  #
  # Es otro proyecto con otra toolchain: `app` depende de Flutter, y el
  # analizador de la raíz no lo tiene. Analizarlo desde acá produce errores de
  # URI irresolubles — y antes NO fallaba, solo porque Flutter estaba instalado
  # en el mismo job de CI. Ese acoplamiento tapaba este problema.
  #
  # El fixture se analiza a sí mismo, en su propio job, con su propia toolchain
  # fijada. Quien lo verifica no es nadie de acá.
  exclude:
    - fixtures/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: warning
